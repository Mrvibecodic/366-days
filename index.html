:root {
    color-scheme: light;
    --bg:        #fcfcfb;
    --surface:   #ffffff;
    --sunken:    #f5f4f1;
    --border:    #eceae4;
    --border-2:  #dddbd3;

    --ink:       #17160f;
    --on-ink:    #fcfcfb;
    --text:      #1b1a14;
    --text-2:    #4d4b42;
    --text-3:    #4d4b42;

    --accent:      #2647cf;
    --accent-soft: #eceffe;
    --success:     #127a56;
    --success-soft:#e6f2ec;
    --warning:     #8f5f10;
    --error:       #bf3b30;
    --error-soft:  #fbecea;

    --color-blue:#2647cf; --color-cyan:#0e7490; --color-dark:#1e293b; --color-grape:#7c3aed;
    --color-gray:#57564e; --color-green:#127a56; --color-indigo:#4338ca; --color-lime:#4d7c0f;
    --color-orange:#c2410c; --color-pink:#be185d; --color-red:#bf3b30; --color-teal:#0f766e;
    --color-violet:#7c3aed; --color-yellow:#a16207;

    --r-xl:  20px;
    --r:     14px;
    --r-sm:  10px;
    --r-xs:  8px;
    --r-pill: 999px;

    --maxw: 860px;
    --ease: cubic-bezier(.2, 0, 0, 1);
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Twemoji Country Flags", sans-serif;
    --display: "Inter Tight", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}

html.dark {
    color-scheme: dark;
    --bg:        #0d0d0b;
    --surface:   #161613;
    --sunken:    #121210;
    --border:    #262520;
    --border-2:  #3a382f;

    --ink:       #f3f2ec;
    --on-ink:    #12110c;
    --text:      #edece7;
    --text-2:    #b6b4a8;
    --text-3:    #a9a79b;

    --accent:      #86a0ff;
    --accent-soft: #1a2036;
    --success:     #40c087;
    --success-soft:#12241c;
    --warning:     #d6a23e;
    --error:       #f0736b;
    --error-soft:  #2a1613;

    --color-blue:#86a0ff; --color-green:#40c087; --color-red:#f0736b; --color-yellow:#d6a23e;
    --color-cyan:#22b8cf; --color-indigo:#8b93ff; --color-violet:#b28bfa; --color-grape:#b28bfa;
    --color-orange:#fb923c; --color-pink:#f472b6; --color-teal:#2dd4bf; --color-lime:#a3e635; --color-gray:#a9a79b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; overflow-x: clip; }

body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
    padding: 0 16px calc(56px + env(safe-area-inset-bottom));
}

svg { display: block; }
.icon-svg { width: 18px; height: 18px; }
.w-4 { width: 16px; height: 16px; }
.w-5 { width: 18px; height: 18px; }
::selection { background: var(--accent-soft); }

.topbar {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    max-width: var(--maxw); margin: 0 auto; padding: 20px 0 16px;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: saturate(180%) blur(14px);
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; opacity: 0; transition: opacity .3s var(--ease); }
.brand.ready { opacity: 1; }
.brand__logo { width: 32px; height: 32px; border-radius: var(--r-xs); object-fit: cover; border: 1px solid var(--border); flex-shrink: 0; }
.brand__mark {
    width: 32px; height: 32px; border-radius: var(--r-xs); flex-shrink: 0;
    display: grid; place-items: center; font-family: var(--display);
    font-size: 16px; font-weight: 600; letter-spacing: -.03em;
    background: var(--ink); color: var(--on-ink);
}
.brand__name { font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.controls { display: flex; align-items: center; gap: 8px; opacity: 0; transition: opacity .3s var(--ease); }
.controls.ready { opacity: 1; }

.container { max-width: var(--maxw); margin: 0 auto; }
.stack { display: flex; flex-direction: column; gap: 20px; }

.section-eyebrow {
    display: flex; align-items: center; gap: 8px;
    font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    color: var(--text-3); padding: 0 2px 14px;
}
.section-eyebrow__count {
    margin-left: auto; font-family: var(--display); font-size: 12px; letter-spacing: 0; font-weight: 500;
    color: var(--text-2); text-transform: none;
}

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 16px; }

.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap;
    font-family: inherit; font-size: 13.5px; font-weight: 500; line-height: 1;
    color: var(--text); background: transparent;
    border: 1px solid var(--border-2); border-radius: var(--r-sm);
    padding: 10px 14px; cursor: pointer;
    transition: background .14s var(--ease), border-color .14s var(--ease), color .14s var(--ease), opacity .14s var(--ease);
    -webkit-tap-highlight-color: transparent;
}
.btn:hover { background: var(--sunken); }
.btn:active { background: var(--sunken); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn--primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); font-weight: 550; }
.btn--primary:hover { opacity: .9; background: var(--ink); }
.btn--primary:active { opacity: .8; }

.btn--icon { padding: 10px; }
.btn--icon .btn__text { display: none; }
.btn--sm { padding: 8px; font-size: 13px; }
.btn--block { width: 100%; }
.controls .btn--icon:not(.btn--primary) .btn__text { display: none; }
.controls .btn--icon:not(.btn--primary) { padding: 9px; }

@media (min-width: 560px) {
    .btn--icon { padding: 9px 13px; }
    .btn--icon .btn__text { display: inline; }
}

.hero { position: relative; background: transparent; border: none; padding: 4px 2px 0; display: flex; flex-direction: column; gap: 18px; }
.hero__top { display: flex; align-items: center; gap: 15px; }
.hero__status {
    width: 46px; height: 46px; border-radius: var(--r); flex-shrink: 0;
    display: grid; place-items: center;
}
.hero__status svg { width: 22px; height: 22px; }
.hero__status.is-active { color: var(--success); background: var(--success-soft); }
.hero__status.is-inactive { color: var(--error); background: var(--error-soft); }

.hero__id { min-width: 0; flex: 1; }
.hero__name { font-family: var(--display); font-size: 27px; font-weight: 600; letter-spacing: -.03em; line-height: 1.1; overflow-wrap: anywhere; }
.hero__sub { color: var(--text-2); font-size: 13.5px; margin-top: 7px; }

.badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 500; letter-spacing: 0;
    padding: 4px 11px 4px 9px; border-radius: var(--r-pill);
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge-active { color: var(--success); background: var(--success-soft); }
.badge-inactive, .badge-expired, .badge-disabled, .badge-limited { color: var(--error); background: var(--error-soft); }

.stats { display: flex; flex-direction: column; gap: 10px; }
.stats__row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stats__row .stat:last-child:nth-child(odd) { grid-column: 1 / -1; }
@media (min-width: 460px) {
    .stats__row { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
    .stats__row .stat:last-child:nth-child(odd) { grid-column: auto; }
}
.stat { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto 1fr; column-gap: 7px; align-items: center; background: var(--sunken); border: 1px solid var(--border-2); border-radius: var(--r); padding: 12px 14px; }
.stat[data-tip] { cursor: help; }
.stat:hover, .stat.tip-open { z-index: 5; }
.stat__icon { color: var(--text-3); opacity: .8; }
.stat__icon svg { width: 15px; height: 15px; }
.stat__label, .stat__value { position: relative; }
.stat__tip { position: absolute; z-index: 6; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%) translateY(4px); background: var(--ink); color: var(--on-ink); font-size: 12px; font-weight: 500; line-height: 1.4; letter-spacing: 0; text-transform: none; padding: 8px 11px; border-radius: 9px; width: max-content; max-width: min(220px, 78vw); box-shadow: 0 8px 22px rgba(0,0,0,.2); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .15s var(--ease), transform .15s var(--ease); }
.stat__tip::after { content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top-color: var(--ink); }
.stat:hover .stat__tip, .stat.tip-open .stat__tip { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
.stat--warn { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--warning) 50%, transparent); }
.stat--danger { background: var(--error-soft); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--error) 45%, transparent); }
.stat--warn .stat__value { color: var(--warning); }
.stat--danger .stat__value { color: var(--error); }
.stat__note { position: relative; grid-column: 1 / -1; margin-top: 9px; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 5px; line-height: 1.2; }
.stat--warn .stat__note { color: var(--warning); }
.stat--danger .stat__note { color: var(--error); }
html.season-winter { --season:#2a5da8; --accent:#2a5da8; --accent-soft:#e8f1fb; --bg:#f1f5fb; }
html.season-spring { --season:#1d7040; --accent:#1d7040; --accent-soft:#e7f3ea; --bg:#f1f6f1; }
html.season-summer { --season:#785915; --accent:#785915; --accent-soft:#f6f0e2; --bg:#faf8f3; }
html.season-autumn { --season:#924f18; --accent:#924f18; --accent-soft:#f6ece4; --bg:#faf6f1; }
html.dark.season-winter { --season:#8ab0f0; --accent:#8ab0f0; --accent-soft:#1a2536; --bg:#0d0f13; }
html.dark.season-spring { --season:#6fc491; --accent:#6fc491; --accent-soft:#182a1f; --bg:#0d100e; }
html.dark.season-summer { --season:#e0bd72; --accent:#e0bd72; --accent-soft:#2b2413; --bg:#12100b; }
html.dark.season-autumn { --season:#e79a6f; --accent:#e79a6f; --accent-soft:#291b13; --bg:#120f0c; }

.season-motif { display: none; flex-shrink: 0; }
html.seasonal .season-motif { display: flex; align-items: center; opacity: 1; pointer-events: none; }
html.seasonal .season-motif svg { width: 44px; height: 44px; }
html.seasonal .stat__icon { color: var(--season); }
#weather { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }#sunrays { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 50; mix-blend-mode: multiply; opacity: 0; transition: opacity 1s ease; background: radial-gradient(200px 200px at 100% 0%, rgba(255,206,116, calc(.26 * var(--sun, 1))), rgba(255,206,116, 0) 72%); }#sunrays::before { content: ""; position: absolute; top: -35%; right: -30%; width: 120%; height: 120%; background: repeating-conic-gradient(from 0deg at 100% 0%, rgba(255,224,150,0) 0deg, rgba(255,224,150, calc(.06 * var(--sun, 1))) 3.5deg, rgba(255,224,150,0) 12deg); -webkit-mask-image: radial-gradient(78% 78% at 100% 0%, #000, rgba(0,0,0,0) 66%); mask-image: radial-gradient(78% 78% at 100% 0%, #000, rgba(0,0,0,0) 66%); }html.season-summer #sunrays { opacity: 1; }html.dark #sunrays { mix-blend-mode: screen; }
#ground { position: fixed; left: 0; right: 0; bottom: 0; height: 180px; z-index: 0; pointer-events: none; display: none; }
@media (max-width: 560px) { #ground { height: 104px; } .stat__value { font-size: 17px; } .traffic .stat__value { font-size: 19px; } .hero__name { font-size: 24px; } .topbar { gap: 10px; padding: 12px 0 10px; } .controls { flex-shrink: 0; gap: 6px; } .controls .btn--icon, .controls .btn--icon:not(.btn--primary) { padding: 0; width: 42px; height: 42px; } .step { align-items: flex-start; } .step__buttons { margin-left: 40px; width: calc(100% - 40px); } .step__buttons .btn, .guide-card__buttons .btn, .acc-buttons .btn { flex: 1 1 100%; min-width: 0; min-height: 44px; white-space: normal; line-height: 1.2; text-align: center; } .stat__tip { left: 0; right: 0; top: calc(100% + 8px); bottom: auto; transform: none; width: auto; max-width: none; white-space: normal; } .stat:hover .stat__tip, .stat.tip-open .stat__tip { transform: none; } .stat__tip::after { top: auto; bottom: 100%; left: 20px; transform: none; border-top-color: transparent; border-bottom-color: var(--ink); } }
html.seasonal #ground { display: block; }
#ground svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.container, .footer { position: relative; z-index: 1; }
.seg__item, .lang-btn, .modal__close { -webkit-tap-highlight-color: transparent; }
:focus:not(:focus-visible) { outline: none; }
.set-row--switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.set-row--switch .set-label { margin-bottom: 0; }
.toggle { position: relative; width: 50px; height: 30px; border-radius: 999px; background: var(--border-2); cursor: pointer; transition: background .18s var(--ease); flex-shrink: 0; }
.toggle.on { background: var(--accent); }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .18s var(--ease); }
.toggle.on::after { transform: translateX(20px); }
.stat__label { font-size: 11.5px; font-weight: 500; letter-spacing: .05em; line-height: 1.25; text-transform: uppercase; color: var(--text-3); overflow-wrap: anywhere; }
.stat__value { grid-column: 1 / -1; align-self: end; font-family: var(--display); font-size: 19px; font-weight: 600; margin-top: 6px; letter-spacing: -.02em; overflow-wrap: anywhere; font-feature-settings: "tnum" 1; }

.traffic { grid-column: 1 / -1; }
.traffic .stat__value { font-size: 22px; }
.traffic__bar { grid-column: 1 / -1; margin-top: 13px; height: 6px; border-radius: var(--r-pill); background: var(--bg); overflow: hidden; }
.traffic__reset { position: relative; grid-column: 1 / -1; margin-top: 9px; font-size: 11.5px; color: var(--text-3); display: flex; align-items: center; gap: 5px; }
.traffic__fill { height: 100%; border-radius: var(--r-pill); background: var(--accent); transition: width .5s var(--ease); }
.traffic__fill.is-high { background: var(--warning); }
.traffic__fill.is-full { background: var(--error); }

.hero--collapsed { gap: 0; }
.hero__toggle { display: flex; align-items: center; gap: 15px; cursor: pointer; }
.hero__toggle .hero__chev { margin-left: auto; color: var(--text-3); transition: transform .22s var(--ease); }
.hero--collapsed.open .hero__chev { transform: rotate(180deg); }
.hero__body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s var(--ease); }
.hero--collapsed.open .hero__body { grid-template-rows: 1fr; }
.hero__body > div { overflow: hidden; }
.hero__body .stats { margin-top: 20px; }

.kv { display: flex; flex-direction: column; }
.kv__row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px 0; border-bottom: 1px solid var(--border); }
.kv__row:last-child { border-bottom: none; }
.kv__k { color: var(--text-2); font-size: 14px; }
.kv__v { font-weight: 500; font-size: 14px; text-align: right; overflow-wrap: anywhere; }

.seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: var(--r); background: var(--sunken); }
.seg__item {
    flex: 1 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 10px 6px; border-radius: var(--r-xs); border: 1px solid transparent; cursor: pointer; white-space: nowrap;
    font-size: 13px; font-weight: 500; color: var(--text-2);
    transition: color .14s var(--ease), background .14s var(--ease);
}
.seg__item svg { width: 16px; height: 16px; }
.seg__item:hover { color: var(--text); }
.seg__item.active { color: var(--text); background: var(--surface); border-color: var(--border); }

.app-head { display: flex; align-items: center; gap: 12px; margin: 14px 0 12px; }
.app-head__icon { width: 40px; height: 40px; border-radius: var(--r-sm); display: grid; place-items: center; background: var(--sunken); border: 1px solid var(--border); color: var(--text); flex-shrink: 0; }
.app-head__icon svg { width: 21px; height: 21px; }
.app-head__name { font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
.app-head .star-icon { width: 15px; height: 15px; color: var(--accent); flex-shrink: 0; }
.app-head__icon svg { fill: currentColor; }
.app-head__icon svg [fill="none"] { fill: none; }
.app-head__icon svg [fill]:not([fill="none"]) { fill: currentColor; }

.steps { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
.step { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 13px; background: var(--sunken); border-radius: var(--r); padding: 12px 14px; }
.step__num { width: 27px; height: 27px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--display); font-weight: 600; font-size: 13px; flex-shrink: 0; }
.step__body { flex: 1 1 150px; min-width: 0; }
.step__title { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
.step__desc { color: var(--text-2); font-size: 13.5px; line-height: 1.45; margin-top: 2px; }
.step__desc a { color: var(--accent); }
.step__buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }

.guides-cards { display: grid; grid-template-columns: 1fr; gap: 10px; }
.guide-card { background: var(--sunken); border-radius: var(--r); padding: 17px; }
.guide-card__head { display: flex; align-items: center; gap: 11px; margin-bottom: 10px; }
.guide-card__icon { width: 33px; height: 33px; border-radius: var(--r-sm); display: grid; place-items: center; color: #fff; flex-shrink: 0; }
.guide-card__icon svg { width: 18px; height: 18px; }
.guide-card__title { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
.guide-card__desc { color: var(--text-2); font-size: 14px; line-height: 1.6; }
.guide-card__desc a { color: var(--accent); }
.guide-card__buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }

.acc { display: flex; flex-direction: column; gap: 8px; }
.acc-item { background: var(--sunken); border-radius: var(--r); overflow: hidden; }
.acc-head { display: flex; align-items: center; gap: 11px; padding: 14px 16px; cursor: pointer; }
.acc-icon { width: 31px; height: 31px; border-radius: var(--r-sm); display: grid; place-items: center; color: #fff; flex-shrink: 0; }
.acc-icon svg { width: 16px; height: 16px; }
.acc-title { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: -.01em; flex: 1; }
.acc-chev { color: var(--text-3); transition: transform .22s var(--ease); }
.acc-item.open .acc-chev { transform: rotate(180deg); }
.acc-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .26s var(--ease); }
.acc-item.open .acc-body { grid-template-rows: 1fr; }
.acc-body > div { overflow: hidden; }
.acc-body__inner { padding: 0 16px 16px 58px; }
.acc-desc { color: var(--text-2); font-size: 14px; line-height: 1.6; }
.acc-desc a { color: var(--accent); }
.acc-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

.tl { display: flex; flex-direction: column; gap: 18px; margin-top: 2px; }
.tl-dots { display: flex; align-items: center; padding: 0 2px; }
.tl-dot { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; cursor: pointer; flex-shrink: 0; opacity: .3; transition: opacity .18s var(--ease); }
.tl-dot svg { width: 16px; height: 16px; }
.tl-dot.active, .tl-dot.done { opacity: 1; }
.tl-line { flex: 1; height: 2px; background: var(--border); }
.tl-line.done { background: var(--accent); }
.tl-stage { display: none; }
.tl-stage.active { display: block; }
.tl-nav { display: flex; gap: 9px; }
.tl-nav .btn { flex: 1; }
.tl-nav .btn:disabled { opacity: .4; cursor: not-allowed; }

.keys { display: flex; flex-direction: column; gap: 8px; }
.key { display: flex; align-items: center; gap: 12px; background: var(--sunken); border-radius: var(--r-sm); padding: 10px 11px 10px 14px; }
.key__name { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1; font-size: 13.5px; font-weight: 500; }
.key__name svg { color: var(--text-3); flex-shrink: 0; }
.key__name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.key__actions { display: flex; gap: 7px; flex-shrink: 0; }
.key .btn--sm { width: 40px; height: 40px; padding: 0; }

.collapsible { padding: 0; }
.card-toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; cursor: pointer; }
.card-toggle .chev { color: var(--text-3); transition: transform .22s var(--ease); }
.collapsible.open .card-toggle .chev { transform: rotate(180deg); }
.collapsible__body { display: grid; grid-template-rows: 0fr; padding: 0 16px; transition: grid-template-rows .28s var(--ease), padding .28s var(--ease); }
.collapsible.open .collapsible__body { padding-bottom: 16px; }
.collapsible.open .collapsible__body { grid-template-rows: 1fr; }
.collapsible__body > div { overflow: hidden; }
.collapsible .section-eyebrow { padding-bottom: 0; }

.footer { max-width: var(--maxw); margin: 36px auto 0; padding: 12px 18px; text-align: center; color: var(--text-2); font-size: 12.5px; position: relative; z-index: 2; background: color-mix(in srgb, var(--surface) 90%, transparent); border-radius: 14px; border: 1px solid var(--border); }

.modal { position: fixed; inset: 0; z-index: 100; display: none; align-items: flex-end; justify-content: center; background: rgba(20,19,14,.4); backdrop-filter: blur(3px); }
html.dark .modal { background: rgba(0,0,0,.6); }
.modal.active { display: flex; animation: fade .16s var(--ease); }
.modal__card {
    width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-xl) var(--r-xl) 0 0;
    padding: 8px 22px calc(24px + env(safe-area-inset-bottom));
    max-height: 88vh; overflow-y: auto; animation: slideUp .26s var(--ease);
}
@media (min-width: 560px) {
    .modal { align-items: center; padding: 20px; }
    .modal__card { border-radius: var(--r-xl); animation: pop .18s var(--ease); }
}
.modal__grip { width: 36px; height: 4px; border-radius: 4px; background: var(--border-2); margin: 8px auto 16px; }
@media (min-width: 560px) { .modal__grip { display: none; } }
.modal__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.modal__title { font-family: var(--display); font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 10px; letter-spacing: -.02em; }
.modal__close { width: 40px; height: 40px; border-radius: var(--r-xs); border: 1px solid var(--border); cursor: pointer; background: transparent; color: var(--text-2); font-size: 20px; line-height: 1; display: grid; place-items: center; }
.modal__close:hover { background: var(--sunken); }

.qr-box { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 4px 0; }
.qr-frame { background: #fff; padding: 14px; border-radius: var(--r-sm); border: 1px solid var(--border); }
.qr-frame img { display: block; width: 196px; height: 196px; image-rendering: pixelated; }
.qr-hint { color: var(--text-2); font-size: 13px; text-align: center; }
.modal__linkbox { display: flex; align-items: center; gap: 10px; background: var(--sunken); border-radius: var(--r-sm); padding: 10px 10px 10px 14px; margin-top: 14px; }
.modal__linkbox code { font-family: var(--mono); font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

.set-row { padding: 16px 0; border-bottom: 1px solid var(--border); }
.set-row:last-child { border-bottom: none; }
