name: release

on:
  push:
    branches: [latest]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: t
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.t.outputs.tag }}"
          if [ -z "$TAG" ]; then echo "тега нет — пропускаем"; exit 0; fi
          NOTES=".github/release-notes/$TAG.md"
          if [ ! -f "$NOTES" ]; then echo "нет файла $NOTES — пропускаем"; exit 0; fi
          if gh release view "$TAG" >/dev/null 2>&1; then echo "релиз $TAG уже опубликован"; exit 0; fi
          TITLE=$(head -1 "$NOTES")
          tail -n +2 "$NOTES" > "$RUNNER_TEMP/body.md"
          gh release create "$TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/body.md"
          echo "опубликован релиз $TAG"
