name: build-and-publish

on:
  push:
    branches: [latest, dev]
    tags: ['v*']
    paths-ignore:
      - '.github/upstream-digest.txt'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check template
        run: |
          if [ "$(tr -d '\000' < index.html | wc -c)" -ne "$(wc -c < index.html)" ]; then echo "index.html: NUL bytes"; exit 1; fi
          OUT=$(node randomize.js index.html "$RUNNER_TEMP/subpage.html")
          echo "$OUT"
          C=$(echo "$OUT" | sed -n 's/.*classes=\([0-9]*\).*/\1/p')
          G=$(echo "$OUT" | sed -n 's/.*globals=\([0-9]*\).*/\1/p')
          if [ "${C:-0}" -lt 100 ] || [ "${G:-0}" -lt 80 ]; then echo "randomize.js: classes=$C globals=$G"; exit 1; fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mrvibecodic/366-days
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/latest' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
